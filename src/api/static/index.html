<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hybrid-RAG</title>
<style>
:root {
  --bg: #282828;
  --bg0: #1d2021;
  --bg1: #3c3836;
  --bg2: #504945;
  --fg: #ebdbb2;
  --fg0: #fbf1c7;
  --fg1: #a89984;
  --red: #cc241d;
  --green: #98971a;
  --yellow: #d79921;
  --blue: #458588;
  --purple: #b16286;
  --aqua: #689d6a;
  --orange: #d65d0e;
  --gray: #928374;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  line-height: 1.5;
}
header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--bg1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
header h1 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
header h1 span { color: var(--fg1); font-weight: 400; }
.status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--fg1);
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--gray);
}
.status-dot.ok { background: var(--green); }
.status-dot.err { background: var(--red); }

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.chat:empty::after {
  content: 'Upload a document and ask a question to get started.';
  color: var(--fg1);
  font-size: 14px;
  text-align: center;
  padding: 48px 0;
}
.msg {
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
}
.msg.user { text-align: right; }
.msg.user .bubble {
  background: var(--blue);
  color: var(--fg0);
  display: inline-block;
  text-align: left;
  border-radius: 12px 12px 4px 12px;
}
.msg.assistant .bubble {
  background: var(--bg1);
  border-radius: 12px 12px 12px 4px;
}
.msg.system .bubble {
  background: var(--bg0);
  border: 1px solid var(--bg2);
  border-radius: 8px;
  font-size: 13px;
  color: var(--fg1);
}
.bubble {
  padding: 12px 16px;
  font-size: 14px;
  line-height: 1.6;
  max-width: 100%;
  word-wrap: break-word;
}
.bubble pre {
  background: var(--bg0);
  padding: 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 13px;
  margin: 8px 0;
}
.bubble code {
  background: var(--bg0);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}
.bubble a { color: var(--blue); text-decoration: underline; }
.bubble .ref { color: var(--aqua); font-size: 12px; }
.pulse { animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.input-area {
  flex-shrink: 0;
  border-top: 1px solid var(--bg1);
  padding: 16px 24px;
}
.upload-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}
.upload-bar label {
  background: var(--bg1);
  border: 1px dashed var(--bg2);
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
  color: var(--fg1);
  transition: border-color .15s, background .15s;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.upload-bar label:hover { border-color: var(--blue); background: var(--bg2); }
.upload-bar input[type="file"] { display: none; }
.upload-bar .file-name { font-size: 13px; color: var(--fg1); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upload-bar .task-status { font-size: 12px; color: var(--yellow); }
.btn {
  background: var(--bg1);
  border: none;
  color: var(--fg);
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  transition: background .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg2); }
.btn.primary { background: var(--blue); color: var(--fg0); }
.btn.primary:hover { background: #3c7e8a; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.sm { padding: 6px 14px; font-size: 13px; }

.query-row {
  display: flex;
  gap: 8px;
}
.query-row input {
  flex: 1;
  background: var(--bg1);
  border: 1px solid var(--bg2);
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--fg);
  outline: none;
  transition: border-color .15s;
}
.query-row input:focus { border-color: var(--blue); }
.query-row input::placeholder { color: var(--fg1); }

/* ── Split layout: chat left, log right ── */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
}
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.log-panel {
  width: 320px;
  border-left: 1px solid var(--bg1);
  background: var(--bg0);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.log-panel-header {
  padding: 12px 16px;
  font-size: 12px;
  font-weight: 600;
  color: var(--fg1);
  border-bottom: 1px solid var(--bg2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.log-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 11px;
}
.log-line {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 16px;
  color: var(--fg1);
  border-left: 3px solid transparent;
  transition: border-color .2s, background .15s;
}
.log-line.busy {
  border-left-color: var(--yellow);
  background: rgba(215,153,33,0.06);
}
.log-line.done {
  border-left-color: var(--green);
  color: var(--fg);
}
.log-line .ll-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.log-line.busy .ll-dot {
  background: var(--yellow);
  animation: pulse 1s ease-in-out infinite;
}
.log-line.done .ll-dot {
  background: var(--green);
}
.log-line .ll-label { flex: 1; }
.log-line .ll-ms { color: var(--gray); font-size: 10px; }
.log-line .ll-items { color: var(--gray); font-size: 10px; }
.log-panel-footer {
  padding: 8px 16px;
  font-size: 10px;
  color: var(--gray);
  border-top: 1px solid var(--bg2);
  text-align: right;
}

/* ── Collapsible sections ── */
.collapse { margin-top: 12px; border-top: 1px solid var(--bg2); padding-top: 8px; }
.collapse-header {
  font-size: 12px; color: var(--fg1); cursor: pointer; user-select: none;
  padding: 4px 0; display: flex; align-items: center; gap: 6px;
}
.collapse-header:hover { color: var(--blue); }
.collapse-header .badge {
  font-size: 10px; background: var(--bg2); padding: 1px 6px; border-radius: 8px;
  color: var(--fg1); margin-left: auto;
}
.collapse-body { display: none; margin-top: 8px; max-height: 400px; overflow-y: auto; }
.collapse-body.open { display: block; }
.collapse-body pre {
  background: var(--bg0); padding: 10px; border-radius: 6px;
  font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  margin: 0;
}
.chunk-item {
  background: var(--bg0); border: 1px solid var(--bg2); border-radius: 6px;
  padding: 8px 10px; margin-bottom: 6px; font-size: 12px;
}
.chunk-item .chunk-meta {
  display: flex; gap: 12px; color: var(--fg1); font-size: 11px; margin-bottom: 4px;
}
.chunk-item .chunk-meta .score { color: var(--aqua); font-weight: 600; }

.metrics { margin-top: 8px; }
.metrics-toggle {
  font-size: 12px; color: var(--fg1); cursor: pointer; user-select: none;
  padding: 4px 0; display: inline-block;
}
.metrics-toggle:hover { color: var(--blue); }
.metrics-body { display: none; margin-top: 8px; }
.metrics-body.open { display: block; }
.metrics-bar {
  display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 10px;
}
.metrics-bar .seg {
  height: 100%; transition: width .3s; position: relative; min-width: 2px;
}
.metrics-bar .seg:hover { opacity: .8; }
.metrics-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.metrics-table th {
  text-align: left; padding: 4px 8px; color: var(--fg1);
  border-bottom: 1px solid var(--bg2); font-weight: 500;
}
.metrics-table td { padding: 4px 8px; border-bottom: 1px solid var(--bg0); }
.metrics-table tr:last-child td { border-bottom: none; }
.metrics-table .bar-cell { display: flex; align-items: center; gap: 6px; }
.metrics-table .swatch {
  width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0;
}
.metrics-table .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg0); }
.metrics-table .num-dim { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg1); }
.metrics-footer { font-size: 11px; color: var(--fg1); margin-top: 8px; }

.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg0);
  border: 1px solid var(--bg2);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--fg1);
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  z-index: 100;
}
.toast.show { opacity: 1; }

@media (max-width: 600px) {
  header { padding: 12px 16px; }
  header h1 { font-size: 16px; }
  .chat { padding: 16px; }
  .input-area { padding: 12px 16px; }
  .upload-bar { flex-wrap: wrap; }
  .upload-bar label { flex: auto; }
}
</style>
</head>
<body>

<header>
  <h1>Hybrid-RAG <span>retrieval engine</span></h1>
  <div class="status">
    <span class="status-dot" id="healthDot"></span>
    <span id="healthText">checking...</span>
  </div>
</header>

<div class="main">
  <div class="chat-area">
    <div class="chat" id="chat"></div>
    <div class="input-area">
      <div class="upload-bar">
        <label for="fileInput" id="fileLabel">+ Upload PDF</label>
        <input type="file" id="fileInput" accept=".pdf">
        <span class="file-name" id="fileName"></span>
        <span class="task-status" id="taskStatus"></span>
        <button class="btn sm" id="ingestBtn" disabled>Ingest</button>
      </div>
      <div class="query-row">
        <input type="text" id="queryInput" placeholder="Ask a question about your documents..." autocomplete="off">
        <button class="btn primary" id="askBtn" disabled>Ask</button>
      </div>
    </div>
  </div>
  <div class="log-panel">
    <div class="log-panel-header">Pipeline</div>
    <div class="log-panel-body" id="logBody"></div>
    <div class="log-panel-footer" id="logFooter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
let apiKey = '';
let taskId = '';
let polling = false;

const $ = s => document.querySelector(s);
const chat = $('#chat');
const logBody = $('#logBody');
const logFooter = $('#logFooter');
const healthDot = $('#healthDot');
const healthText = $('#healthText');
const fileInput = $('#fileInput');
const fileName = $('#fileName');
const taskStatus = $('#taskStatus');
const ingestBtn = $('#ingestBtn');
const queryInput = $('#queryInput');
const askBtn = $('#askBtn');

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    healthDot.className = 'status-dot ' + (d.status === 'healthy' ? 'ok' : 'err');
    healthText.textContent = d.status === 'healthy' ? 'Online' : 'Degraded';
    return true;
  } catch {
    healthDot.className = 'status-dot err';
    healthText.textContent = 'Offline';
    return false;
  }
}

function key() {
  const k = sessionStorage.getItem('api_key');
  return k || '';
}

function setKey(k) { sessionStorage.setItem('api_key', k); }
async function api(method, path, body) {
  const headers = {};
  const k = key();
  if (k) headers['X-API-Key'] = k;
  if (body && !(body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(body);
  }
  const r = await fetch(`${API}${path}`, { method, headers, body });
  return r;
}

const _STAGE_ORDER = [
  'query_understanding', 'embedding', 'hard_filter', 'doc_soft_rank',
  'chunk_hybrid_search', 'rerank', 'graph_expansion', 'context_build', 'generate',
];

function startLog() {
  logBody.innerHTML = _STAGE_ORDER.map(s =>
    `<div class="log-line busy" data-stage="${s}"><span class="ll-dot"></span><span class="ll-label">${_STAGE_LABELS[s]}</span><span class="ll-ms"></span></div>`
  ).join('');
  logFooter.textContent = 'running…';
  logBody.scrollTop = 0;
}

function updateLog(stages) {
  const map = {};
  for (const s of stages) map[s.name] = s;
  let totalMs = 0;
  for (const s of stages) totalMs += s.ms;
  for (const line of logBody.children) {
    const name = line.dataset.stage;
    const s = map[name];
    if (s) {
      line.className = 'log-line done';
      line.querySelector('.ll-ms').textContent = `${s.ms}ms`;
      if (s.items) line.querySelector('.ll-ms').textContent += ` (${s.items})`;
    }
  }
  logFooter.textContent = `${totalMs}ms total`;
}

function clearLog() {
  logBody.innerHTML = '';
  logFooter.textContent = '';
}

function addMsg(role, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = '<div class="bubble">' + html + '</div>';
  chat.appendChild(d);
  d.scrollIntoView({ behavior: 'smooth' });
  return d;
}

function addThinking() {
  const d = document.createElement('div');
  d.className = 'msg assistant';
  d.id = 'thinking';
  d.innerHTML = '<div class="bubble pulse">Thinking...</div>';
  chat.appendChild(d);
  d.scrollIntoView({ behavior: 'smooth' });
}

function removeThinking() {
  const t = $('#thinking');
  if (t) t.remove();
}

const _STAGE_COLORS = {
  query_understanding: '#458588', embedding: '#98971a', hard_filter: '#d79921',
  doc_soft_rank: '#d65d0e', chunk_hybrid_search: '#cc241d', rerank: '#b16286',
  graph_expansion: '#689d6a', context_build: '#928374', generate: '#fbf1c7',
};
const _STAGE_LABELS = {
  query_understanding: 'Understanding query…',
  embedding: 'Embedding query…',
  hard_filter: 'Hard-filtering docs…',
  doc_soft_rank: 'Soft-ranking docs…',
  chunk_hybrid_search: 'Hybrid chunk search…',
  rerank: 'Reranking chunks…',
  graph_expansion: 'Expanding graph…',
  context_build: 'Building context…',
  generate: 'Generating answer…',
};

function chunksHTML(chunks) {
  if (!chunks || !chunks.length) return '<div class="chunk-item" style="color:var(--fg1)">No chunks retrieved.</div>';
  return chunks.map(c =>
    `<div class="chunk-item"><div class="chunk-meta"><span class="score">${c.score.toFixed(4)}</span><span>${c.source}</span></div>${c.preview}</div>`
  ).join('');
}

function collapsible(id, label, count, bodyHTML, open) {
  return `<div class="collapse">
    <div class="collapse-header" onclick="(function(el){var b=document.getElementById('${id}');b.classList.toggle('open');el.innerHTML=b.classList.contains('open')?'${label} ▼':'${label} ▶'})(this)">${label} ▶<span class="badge">${count}</span></div>
    <div class="collapse-body${open ? ' open' : ''}" id="${id}">${bodyHTML}</div>
  </div>`;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function pollTask() {
  if (!taskId || polling) return;
  polling = true;
  for (let i = 0; i < 120; i++) {
    try {
      const r = await apiWithAuth('GET', `/ingest/${taskId}`);
      const d = await r.json();
      if (d.status === 'completed') {
        taskStatus.textContent = `✓ ${d.chunks || 0} chunks indexed`;
        taskStatus.style.color = 'var(--green)';
        ingestBtn.disabled = false;
        ingestBtn.textContent = 'Ingest';
        askBtn.disabled = false;
        addMsg('system', `Ingested ${d.chunks || 0} chunks (${d.failed_extractions || 0} extraction failures). Ready to query.`);
        polling = false;
        return;
      }
      if (d.status === 'failed') {
        taskStatus.textContent = '✗ Failed';
        taskStatus.style.color = 'var(--red)';
        ingestBtn.disabled = false;
        ingestBtn.textContent = 'Ingest';
        addMsg('system', `Ingestion failed: ${d.error || 'unknown error'}`);
        polling = false;
        return;
      }
      taskStatus.textContent = d.status;
    } catch { /* retry */ }
    await new Promise(r => setTimeout(r, 2000));
  }
  taskStatus.textContent = 'timeout';
  ingestBtn.disabled = false;
  ingestBtn.textContent = 'Ingest';
  polling = false;
}

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) { fileName.textContent = ''; ingestBtn.disabled = true; return; }
  fileName.textContent = f.name;
  ingestBtn.disabled = false;
});

ingestBtn.addEventListener('click', async () => {
  const f = fileInput.files[0];
  if (!f) return;
  ingestBtn.disabled = true;
  ingestBtn.textContent = 'Uploading...';
  taskStatus.textContent = 'uploading';
  taskStatus.style.color = 'var(--yellow)';

  const fd = new FormData();
  fd.append('file', f);
  if (key()) fd.append('api_key', key());

  try {
    const r = await apiWithAuth('POST', '/ingest/upload', fd);
    const d = await r.json();
    taskId = d.task_id;
    taskStatus.textContent = 'queued';
    addMsg('system', `Uploaded ${f.name}. Ingesting...`);
    pollTask();
  } catch (e) {
    taskStatus.textContent = '✗ Error';
    taskStatus.style.color = 'var(--red)';
    ingestBtn.disabled = false;
    ingestBtn.textContent = 'Ingest';
    toast('Upload failed: ' + e.message);
  }
});

queryInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !askBtn.disabled) askBtn.click();
});

askBtn.addEventListener('click', async () => {
  const q = queryInput.value.trim();
  if (!q) return;
  queryInput.value = '';
  addMsg('user', q);
  addThinking();
  startLog();

  try {
    const r = await apiWithAuth('POST', '/query', { question: q, top_k: 5 });
    removeThinking();
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      addMsg('system', `Error: ${err.detail || r.statusText}`);
      logFooter.textContent = 'failed';
      return;
    }
    const d = await r.json();

    if (d.metrics && d.metrics.stages) updateLog(d.metrics.stages);

    let html = d.answer.replace(/\n/g, '<br>');
    if (d.citations && d.citations.length) {
      html += '<br><br><div class="ref">Sources: ' + d.citations.map(c =>
        `[${c.ref}] ${c.source.split('/').pop() || c.source}`
      ).join(', ') + '</div>';
    }
    if (d.faithfulness != null) {
      html += `<div class="ref">Faithfulness: ${(d.faithfulness * 100).toFixed(0)}%</div>`;
    }

    if (d.chunks && d.chunks.length) {
      html += collapsible('chunks-' + Date.now(), 'Retrieved Chunks', d.chunks.length, chunksHTML(d.chunks));
    }
    if (d.graph_facts) {
      html += collapsible('graph-' + Date.now(), 'Graph Triplets', d.graph_facts.split('\n').length, '<pre>' + d.graph_facts + '</pre>');
    }
    if (d.metrics) {
      html += metricsToHTML(d.metrics);
    }
    addMsg('assistant', html);
  } catch (e) {
    removeThinking();
    addMsg('system', 'Request failed: ' + e.message);
    logFooter.textContent = 'error';
  }
});

function metricsToHTML(m) {
  const stages = m.stages || [];
  const total = m.total_ms || 1;
  const bar = stages.map(s =>
    `<div class="seg" style="width:${(s.ms/total*100).toFixed(1)}%;background:${_STAGE_COLORS[s.name]||'var(--bg2)'}" title="${s.name}: ${s.ms}ms"></div>`
  ).join('');
  const rows = stages.map(s =>
    `<tr><td><div class="bar-cell"><span class="swatch" style="background:${_STAGE_COLORS[s.name]||'var(--bg2)'}"></span>${s.name}</div></td><td class="num">${s.ms}</td><td class="num-dim">${s.items}</td></tr>`
  ).join('');
  const models = m.models || {};
  const footer = Object.entries(models).filter(([,v]) => v).map(([k,v]) => `${k}: ${v}`).join(' · ');
  const id = 'm' + Math.random().toString(36).slice(2, 8);

  return `<div class="metrics">
    <span class="metrics-toggle" onclick="(function(el){var b=document.getElementById('${id}');b.classList.toggle('open');el.textContent=b.classList.contains('open')?'Pipeline Metrics \u25B2':'Pipeline Metrics \u25BC'})(this)">Pipeline Metrics \u25BC</span>
    <div class="metrics-body" id="${id}">
      <div class="metrics-bar">${bar}</div>
      <table class="metrics-table">
        <thead><tr><th>Stage</th><th class="num">ms</th><th class="num-dim">items</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="metrics-footer">${total}ms total${footer ? ' · ' + footer : ''}</div>
    </div>
  </div>`;
}

async function init() {
  sessionStorage.removeItem('api_key');
  const ok = await checkHealth();
  if (ok) askBtn.disabled = false;
  setInterval(checkHealth, 30000);
}

async function apiWithAuth(method, path, body) {
  let r = await api(method, path, body);
  if (r.status === 401) {
    const input = prompt('API key required. Enter your API key:');
    if (input) {
      setKey(input);
      r = await api(method, path, body);
    }
  }
  return r;
}

init();
