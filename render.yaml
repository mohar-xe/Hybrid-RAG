# render.yaml — Render Blueprint (Infrastructure as Code)
# Deploy: push to GitHub → Render auto-detects this file.
# See https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hybrid-rag
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      # Auto-wired from the Postgres database below. Our settings parse
      # this via DATABASE__CONNECTION_STRING (see config/settings.py).
      - key: DATABASE__CONNECTION_STRING
        fromDatabase:
          name: hybrid-rag-db
          property: connectionString
      - key: GENERATOR__BASE_URL
        sync: false
      - key: GENERATOR__MODEL
        sync: false
      - key: GENERATOR__API_KEY
        sync: false
      - key: NER__BASE_URL
        sync: false
      - key: NER__MODEL
        sync: false
      - key: NER__API_KEY
        sync: false
      - key: EMBEDDING__BACKEND
        value: "api"
      - key: EMBEDDING__API_BASE_URL
        sync: false
      - key: EMBEDDING__API_MODEL
        value: "mistral-embed"
      - key: EMBEDDING__API_KEY
        sync: false
      - key: RERANKER__BACKEND
        value: "api"
      - key: RERANKER__API_BASE_URL
        sync: false
      - key: RERANKER__API_MODEL
        value: "mistral-large-latest"
      - key: RERANKER__API_KEY
        sync: false
      - key: API__API_KEY
        sync: false

databases:
  - name: hybrid-rag-db
    plan: free
    region: singapore
    databaseName: hybrid_rag
    postgresMajorVersion: 16
