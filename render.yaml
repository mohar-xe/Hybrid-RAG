# render.yaml — Render Blueprint (Infrastructure as Code)
# Deploy: push to GitHub → Render auto-detects this file.
# See https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hybrid-rag
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      # Auto-wired from the Postgres database below. Our settings parse
      # this via DATABASE__CONNECTION_STRING (see config/settings.py).
      - key: DATABASE__CONNECTION_STRING
        fromDatabase:
          name: hybrid-rag-db
          property: connectionString
      - key: GENERATOR__BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: GENERATOR__MODEL
        value: "openai/gpt-oss-20b"
      - key: GENERATOR__API_KEY
        sync: false
      - key: NER__BASE_URL
        sync: false
      - key: NER__MODEL
        sync: false
      - key: NER__API_KEY
        sync: false
      - key: EMBEDDING__BACKEND
        value: "api"
      - key: EMBEDDING__API_BASE_URL
        sync: false
      - key: EMBEDDING__API_MODEL
        value: "mistral-embed"
      - key: EMBEDDING__API_KEY
        sync: false
      - key: RERANKER__BACKEND
        value: "jina"
      - key: RERANKER__API_MODEL
        value: "jina-reranker-v2-base-multilingual"
      - key: RERANKER__API_BASE_URL
        value: "https://api.jina.ai/v1/rerank"
      - key: RERANKER__API_KEY
        sync: false
      # ------------------------------------------------------------------
      # Disable all local-model fallbacks — Docker has no Ollama or spaCy.
      # The primary API is the only path; a failure -> a clean error, not a
      # cryptic connection-refused to a non-existent local process.
      # ------------------------------------------------------------------
      - key: EXTRACTION__FALLBACK_ENABLED
        value: "false"
      - key: NER__FALLBACK_ENABLED
        value: "false"
      - key: EMBEDDING__FALLBACK_ENABLED
        value: "false"
      - key: GENERATOR__FALLBACK_ENABLED
        value: "false"
      - key: RERANKER__FALLBACK_ENABLED
        value: "false"
      - key: GRAPH__PER_HOP_NEIGHBORS
        value: "5"
      - key: METADATA__FALLBACK_ENABLED
        value: "false"
      - key: METADATA__FALLBACK_BACKEND
        value: "none"
      - key: VERIFIER__FALLBACK_ENABLED
        value: "false"

databases:
  - name: hybrid-rag-db
    plan: free
    region: singapore
    databaseName: hybrid_rag
    postgresMajorVersion: 16
