[project]
name = "hybrid-rag"
version = "0.1.0"
description = "A fullfledged Hybrid Graph RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core: required for API-first mode (remote providers)
    "httpx>=0.27.0",
    "pydantic-settings>=2.14.1",
    "typer>=0.12.0",
    "numpy>=1.26.0",
    # Database
    "psycopg[binary]>=3.2.0",
    # Graph store
    "kuzu==0.11.3",
    # Ingestion
    "pymupdf>=1.27.2.3",
    # Keyphrase extraction (query-time)
    "yake>=0.7.3",
    # ANN search
    "hnswlib==0.8.0",
    # API server
    "fastapi>=0.115.0",
    "python-multipart>=0.0.19",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
# Local/Ollama models (add for offline mode or fallback)
local = [
    "ollama>=0.6.2",
    "sentence-transformers>=5.4.0",
    "einops>=0.8.2",
    "spacy>=3.8.0",
]
# Demo UI (Gradio)
demo = [
    "gradio>=5.0.0",
]
# Notebook support
notebook = [
    "ipykernel>=7.2.0",
]
# Offline evaluation harness
eval = [
    "datasets>=2.18.0",
]
# Test tooling
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["evaluation/tests"]
